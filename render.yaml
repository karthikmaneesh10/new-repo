services:
  # -----------------------------------------------------
  # 1. FastAPI Backend Web Service
  # -----------------------------------------------------
  - type: web
    name: novelnest-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: novelnest-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

  # -----------------------------------------------------
  # 2. React Frontend Static Site
  # -----------------------------------------------------
  - type: web
    name: novelnest-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: novelnest-backend
          property: host

# -----------------------------------------------------
# 3. Managed PostgreSQL Database
# -----------------------------------------------------
databases:
  - name: novelnest-db
    databaseName: novelnest_db
    user: novelnest_user
    plan: free
